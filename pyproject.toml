[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "1.2.6"
description = "OpenAI-compatible router + lifecycle manager for local LLM backends (custom OpenAI endpoint)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
llm-router = "llm_router.__main__:main"

[tool.setuptools]
packages = ["llm_router"]
