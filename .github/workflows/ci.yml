name: CI

# Runs the full test suite on every push and on pull requests. All tests are
# mock-based and use isolated 18xxx ports + temp state dirs — no real models,
# no local absolute paths, so they run identically on the runner and locally.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend + CLI (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Backend suite (27 checks)
        run: bash tests/run_test.sh

      - name: External model detection (20 checks)
        run: python tests/test_external_detect.py

      - name: Dashboard e2e
        run: python tests/dash_e2e.py

      - name: Dashboard Ctrl-C shutdown
        run: python tests/dash_ctrlc.py

      - name: Stop during model startup
        run: bash tests/test_stop_startup.sh

      - name: Stop stops watcher tailers
        run: bash tests/test_stop_watchers.sh

      - name: No stray test ports left behind
        run: |
          if lsof -nP -iTCP -sTCP:LISTEN | grep -Eq ':18[0-9]{3} '; then
            echo "::error::A 18xxx test listener survived the suite"
            lsof -nP -iTCP -sTCP:LISTEN | grep -E ':18[0-9]{3} '
            exit 1
          fi

  ui:
    name: Dashboard UI (jsdom, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: UI suite (111 checks)
        run: node tests/ui_test.js
